<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" fill="none" role="presentation">
  <defs>
    <linearGradient id="dbase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FBBC04" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FBBC04" stop-opacity=".38"/>
      <stop offset="80%"  stop-color="#FBBC04" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dcomet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFE082" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#FFF3C4" stop-opacity=".95"/>
      <stop offset="70%"  stop-color="#FFD54F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes run  { 0%{transform:translateX(-280px)} 100%{transform:translateX(1000px)} }
      @keyframes puls { 0%,100%{opacity:.30} 50%{opacity:.85} }
      .comet { animation: run 3.8s cubic-bezier(.45,0,.55,1) infinite; }
      .node  { animation: puls 2.4s ease-in-out infinite; }
      .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}.n5{animation-delay:2s}
      @media (prefers-reduced-motion: reduce) { .comet,.node { animation: none; } }
    </style>
  </defs>
  <rect y="4" width="1000" height="2" rx="1" fill="url(#dbase)"/>
  <rect class="comet" y="3.5" width="280" height="3" rx="1.5" fill="url(#dcomet)"/>
  <g fill="#FBBC04">
    <circle class="node"    cx="120" cy="5" r="2"/>
    <circle class="node n2" cx="310" cy="5" r="2"/>
    <circle class="node n3" cx="500" cy="5" r="2.6"/>
    <circle class="node n4" cx="690" cy="5" r="2"/>
    <circle class="node n5" cx="880" cy="5" r="2"/>
  </g>
</svg>
