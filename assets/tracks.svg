<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" fill="none" role="img" aria-label="Three tracks: CTO, Google Summer of Code, LFX Mentorship Podman">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="tgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="tclip"><rect width="1000" height="290" rx="16"/></clipPath>
    <style>
      @keyframes card  { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes edge  { 0%,100%{stroke-opacity:.28} 50%{stroke-opacity:.85} }
      @keyframes orbit { from{transform:rotate(0)} to{transform:rotate(360deg)} }
      @keyframes beat  { 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.18);opacity:1} }

      .card { opacity:0; animation: card .8s cubic-bezier(.16,1,.3,1) forwards; }
      .k1{animation-delay:.1s}.k2{animation-delay:.28s}.k3{animation-delay:.46s}
      .edge { animation: edge 4.2s ease-in-out infinite; }
      .e2{animation-delay:1.4s}.e3{animation-delay:2.8s}
      .o1 { animation: orbit 14s linear infinite; transform-origin: 152px 92px; }
      .o2 { animation: orbit 18s linear infinite; transform-origin: 500px 92px; }
      .o3 { animation: orbit 11s linear infinite; transform-origin: 848px 92px; }
      .beat { animation: beat 2.4s ease-in-out infinite; }
      .b2{animation-delay:.8s}.b3{animation-delay:1.6s}
      @media (prefers-reduced-motion: reduce) {
        .card,.edge,.o1,.o2,.o3,.beat { animation: none; }
        .card { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="1000" height="290" fill="url(#tbg)"/>

    <!-- TRACK 1 : CTO -->
    <g class="card k1">
      <rect class="edge" x="24" y="24" width="256" height="242" rx="14"
            fill="#FBBC04" fill-opacity=".05" stroke="#FBBC04" stroke-width="1.4"/>
      <g class="o1" fill="none" stroke="#FBBC04" stroke-opacity=".45">
        <circle cx="152" cy="92" r="30" stroke-dasharray="42 30"/>
      </g>
      <circle class="beat" cx="152" cy="92" r="15" fill="url(#tgold)" style="transform-origin:152px 92px"/>
      <text x="152" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#0d1117"
            font-family="'Segoe UI',Roboto,sans-serif">CTO</text>
      <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" text-anchor="middle">
        <text x="152" y="156" font-size="15" font-weight="700" fill="#FFD54F">Shivam-Info</text>
        <text x="152" y="180" font-size="11" fill="#8b949e">Owns the technical direction</text>
        <text x="152" y="198" font-size="11" fill="#8b949e">architecture &#183; delivery &#183; hiring</text>
        <text x="152" y="230" font-size="10.5" letter-spacing="1.4" fill="#FBBC04">SHIPS THE ROADMAP</text>
      </g>
    </g>

    <!-- TRACK 2 : GSoC -->
    <g class="card k2">
      <rect class="edge e2" x="372" y="24" width="256" height="242" rx="14"
            fill="#FBBC04" fill-opacity=".05" stroke="#FBBC04" stroke-width="1.4"/>
      <g class="o2" fill="none" stroke="#FFD54F" stroke-opacity=".45">
        <circle cx="500" cy="92" r="30" stroke-dasharray="24 40"/>
      </g>
      <circle class="beat b2" cx="500" cy="92" r="15" fill="url(#tgold)" style="transform-origin:500px 92px"/>
      <text x="500" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#0d1117"
            font-family="'Segoe UI',Roboto,sans-serif">GSoC</text>
      <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" text-anchor="middle">
        <text x="500" y="156" font-size="15" font-weight="700" fill="#FFD54F">JSON Schema &#8217;26</text>
        <text x="500" y="180" font-size="11" fill="#8b949e">78 merged across the org</text>
        <text x="500" y="198" font-size="11" fill="#8b949e">spec conformance &#183; test suite</text>
        <text x="500" y="230" font-size="10.5" letter-spacing="1.4" fill="#FBBC04">READS THE RFC FIRST</text>
      </g>
    </g>

    <!-- TRACK 3 : LFX / Podman -->
    <g class="card k3">
      <rect class="edge e3" x="720" y="24" width="256" height="242" rx="14"
            fill="#FBBC04" fill-opacity=".05" stroke="#FBBC04" stroke-width="1.4"/>
      <g class="o3" fill="none" stroke="#F59E0B" stroke-opacity=".45">
        <circle cx="848" cy="92" r="30" stroke-dasharray="52 22"/>
      </g>
      <circle class="beat b3" cx="848" cy="92" r="15" fill="url(#tgold)" style="transform-origin:848px 92px"/>
      <text x="848" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117"
            font-family="'Segoe UI',Roboto,sans-serif">LFX</text>
      <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" text-anchor="middle">
        <text x="848" y="156" font-size="15" font-weight="700" fill="#FFD54F">Podman &#183; applying</text>
        <text x="848" y="180" font-size="11" fill="#8b949e">14 merged in containers/*</text>
        <text x="848" y="198" font-size="11" fill="#8b949e">already contributing upstream</text>
        <text x="848" y="230" font-size="10.5" letter-spacing="1.4" fill="#FBBC04">CI, TESTS &amp; FLAKES</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="999" height="289" rx="16" fill="none" stroke="#FBBC04" stroke-opacity=".22"/>
  </g>
</svg>
