<svg xmlns="http://www.w3.org/2000/svg" width="210" height="22" viewBox="0 0 210 22" fill="none" role="img" aria-label="6 merged pull requests">
  <defs>
    <linearGradient id="gheadlamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="cheadlamp">
      <rect class="rev" x="0" y="4" width="11.5" height="14" rx="7"/>
    </clipPath>
    <style>
      @keyframes rheadlamp { from { transform: translateX(-11.5px) } to { transform: translateX(0) } }
      @keyframes fheadlamp { from { opacity: 0 } to { opacity: 1 } }
      .rev { animation: rheadlamp 1.4s cubic-bezier(.16,1,.3,1) both; animation-delay: 0.58s; }
      .num { animation: fheadlamp .5s ease-out both; animation-delay: 1.38s; }
      @media (prefers-reduced-motion: reduce) { .rev, .num { animation: none; } }
    </style>
  </defs>
  <rect x="0" y="4" width="150.0" height="14" rx="7" fill="#8b949e" fill-opacity=".20"/>
  <g clip-path="url(#cheadlamp)">
    <rect x="0" y="4" width="11.5" height="14" rx="7" fill="url(#gheadlamp)"/>
  </g>
  <text class="num" x="160" y="16" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="14" font-weight="700" fill="#2ea043">6</text>
</svg>
