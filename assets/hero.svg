<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Tushar Verma - GSoC 2026 JSON Schema, Podman upstream contributor, CTO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFD54F"/>
      <stop offset="50%"  stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FBBC04" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#FFF3C4" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#FFF3C4" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FBBC04" stop-opacity=".30"/>
      <stop offset="70%"  stop-color="#FBBC04" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FBBC04" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <mask id="titleMask">
      <text x="60" y="132" font-family="'Segoe UI',Roboto,Ubuntu,Helvetica,Arial,sans-serif"
            font-size="62" font-weight="800" letter-spacing="1.5" fill="#fff">TUSHAR VERMA</text>
    </mask>

    <clipPath id="frameClip"><rect x="0" y="0" width="1000" height="300" rx="16"/></clipPath>

    <style>
      @keyframes sweepX   { 0%{transform:translateX(-460px)} 100%{transform:translateX(1000px)} }
      @keyframes rise     { 0%{transform:translateY(0);opacity:0} 12%{opacity:.85} 100%{transform:translateY(-300px);opacity:0} }
      @keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes spinRev  { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
      @keyframes pulse    { 0%,100%{opacity:.4;transform:scale(.8)} 50%{opacity:1;transform:scale(1.35)} }
      @keyframes breathe  { 0%,100%{opacity:.20} 50%{opacity:.55} }
      @keyframes grow     { from{transform:scaleX(0)} to{transform:scaleX(1)} }

      /* role cycling: 3 lines x 7.5s cycle */
      @keyframes role1 { 0%,2%{opacity:0;transform:translateY(8px)} 6%,28%{opacity:1;transform:translateY(0)} 33%,100%{opacity:0;transform:translateY(-8px)} }
      @keyframes role2 { 0%,33%{opacity:0;transform:translateY(8px)} 38%,61%{opacity:1;transform:translateY(0)} 66%,100%{opacity:0;transform:translateY(-8px)} }
      @keyframes role3 { 0%,66%{opacity:0;transform:translateY(8px)} 71%,94%{opacity:1;transform:translateY(0)} 99%,100%{opacity:0;transform:translateY(-8px)} }

      .sweep  { animation: sweepX 4.5s cubic-bezier(.4,0,.2,1) infinite; }
      .ring-a { animation: spin 24s linear infinite;    transform-origin: 838px 150px; }
      .ring-b { animation: spinRev 16s linear infinite; transform-origin: 838px 150px; }
      .ring-c { animation: spin 34s linear infinite;    transform-origin: 838px 150px; }
      .core   { transform-origin:838px 150px; animation: pulse 2.6s ease-in-out infinite; }
      .halo   { animation: breathe 4s ease-in-out infinite; }
      .rule   { transform:scaleX(0); transform-origin:60px 151px; animation: grow 1.6s cubic-bezier(.16,1,.3,1) forwards; }
      .r1 { opacity:0; animation: role1 7.5s ease-in-out infinite; }
      .r2 { opacity:0; animation: role2 7.5s ease-in-out infinite; }
      .r3 { opacity:0; animation: role3 7.5s ease-in-out infinite; }
      .p  { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sweep,.ring-a,.ring-b,.ring-c,.core,.halo,.rule,.r1,.r2,.r3,.p { animation: none; }
        .r1 { opacity: 1; }
        .rule { transform: scaleX(1); }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <ellipse cx="838" cy="150" rx="260" ry="200" fill="url(#glow)"/>

    <!-- rising particles -->
    <g fill="#FBBC04">
      <circle class="p" cx="120" cy="320" r="1.8" style="animation-duration:9s;  animation-delay:0s"/>
      <circle class="p" cx="215" cy="320" r="2.4" style="animation-duration:12s; animation-delay:1.4s"/>
      <circle class="p" cx="330" cy="320" r="1.5" style="animation-duration:8s;  animation-delay:2.6s"/>
      <circle class="p" cx="455" cy="320" r="2.1" style="animation-duration:11s; animation-delay:.7s"/>
      <circle class="p" cx="560" cy="320" r="1.7" style="animation-duration:10s; animation-delay:3.5s"/>
      <circle class="p" cx="668" cy="320" r="2.6" style="animation-duration:13s; animation-delay:2s"/>
      <circle class="p" cx="742" cy="320" r="1.4" style="animation-duration:9.5s;animation-delay:4.2s"/>
      <circle class="p" cx="905" cy="320" r="2.2" style="animation-duration:11.5s;animation-delay:1.1s"/>
      <circle class="p" cx="960" cy="320" r="1.6" style="animation-duration:8.5s;animation-delay:3s"/>
    </g>

    <!-- orbiting pod rings -->
    <g fill="none" stroke-linecap="round">
      <g class="halo"><circle cx="838" cy="150" r="112" stroke="#FBBC04" stroke-opacity=".25" stroke-width="1"/></g>
      <g class="ring-a"><circle cx="838" cy="150" r="92" stroke="url(#gold)" stroke-width="1.6"
            stroke-dasharray="150 44" stroke-opacity=".85"/></g>
      <g class="ring-b"><circle cx="838" cy="150" r="66" stroke="#FFD54F" stroke-width="1.4"
            stroke-dasharray="70 130" stroke-opacity=".8"/></g>
      <g class="ring-c"><circle cx="838" cy="150" r="38" stroke="#F59E0B" stroke-width="1.2"
            stroke-dasharray="30 60" stroke-opacity=".7"/></g>
    </g>
    <g class="ring-a"><circle cx="930" cy="150" r="4" fill="#FFD54F"/></g>
    <g class="ring-b"><circle cx="772" cy="150" r="3.2" fill="#FBBC04"/></g>
    <circle class="core" cx="838" cy="150" r="6" fill="#FFE082"/>

    <!-- eyebrow -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace">
      <text x="60" y="72" font-size="14" letter-spacing="4.2" fill="#FBBC04" fill-opacity=".9">
        GSoC&#8217;26 &#183; JSON SCHEMA &#8212; PODMAN UPSTREAM &#183; NEW DELHI, IN
      </text>
    </g>

    <!-- title + sweeping shine -->
    <text x="60" y="132" font-family="'Segoe UI',Roboto,Ubuntu,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="800" letter-spacing="1.5" fill="url(#gold)">TUSHAR VERMA</text>
    <g mask="url(#titleMask)">
      <rect class="sweep" x="0" y="70" width="460" height="80" fill="url(#sweep)"/>
    </g>

    <!-- animated rule -->
    <rect class="rule" x="60" y="150" width="640" height="3" rx="1.5" fill="url(#gold)"/>

    <!-- cycling role line -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace"
       font-size="19" fill="#c9d1d9">
      <text x="60" y="192" fill="#FBBC04">&#8250;</text>
      <text class="r1" x="82" y="192">Google Summer of Code &#8217;26 @ JSON Schema</text>
      <text class="r2" x="82" y="192">Upstream contributor &#183; Podman &#183; Skopeo &#183; Buildah</text>
      <text class="r3" x="82" y="192">CTO @ Shivam-Info &#183; Software Engineer @ Mugafi</text>
    </g>

    <!-- stat strip -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace">
      <g transform="translate(60,222)">
        <rect width="152" height="46" rx="9" fill="#FBBC04" fill-opacity=".08" stroke="#FBBC04" stroke-opacity=".35"/>
        <text x="16" y="21" font-size="17" font-weight="700" fill="#FFD54F">192</text>
        <text x="16" y="37" font-size="10.5" letter-spacing="1.3" fill="#8b949e">MERGED PRs</text>
      </g>
      <g transform="translate(224,222)">
        <rect width="152" height="46" rx="9" fill="#FBBC04" fill-opacity=".08" stroke="#FBBC04" stroke-opacity=".35"/>
        <text x="16" y="21" font-size="17" font-weight="700" fill="#FFD54F">14</text>
        <text x="16" y="37" font-size="10.5" letter-spacing="1.3" fill="#8b949e">CONTAINERS ORG</text>
      </g>
      <g transform="translate(388,222)">
        <rect width="152" height="46" rx="9" fill="#FBBC04" fill-opacity=".08" stroke="#FBBC04" stroke-opacity=".35"/>
        <text x="16" y="21" font-size="17" font-weight="700" fill="#FFD54F">78</text>
        <text x="16" y="37" font-size="10.5" letter-spacing="1.3" fill="#8b949e">JSON SCHEMA</text>
      </g>
      <g transform="translate(552,222)">
        <rect width="152" height="46" rx="9" fill="#FBBC04" fill-opacity=".08" stroke="#FBBC04" stroke-opacity=".35"/>
        <text x="16" y="21" font-size="17" font-weight="700" fill="#FFD54F">10+</text>
        <text x="16" y="37" font-size="10.5" letter-spacing="1.3" fill="#8b949e">UPSTREAM ORGS</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="999" height="299" rx="16" fill="none" stroke="#FBBC04" stroke-opacity=".28"/>
  </g>
</svg>
